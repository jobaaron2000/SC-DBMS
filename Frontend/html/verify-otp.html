<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - SCMS</title>
    <link rel="icon" type="image/png" href="/assets/brgy-logo.PNG">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="bg-blurry-photo">
    <div class="main-container">
        <div class="login-card">
            <img src="../assets/brgy-logo.PNG" alt="Barangay Logo" class="login-logo">
            <h2>Verify OTP</h2>
            <p class="login-subtitle">Enter the OTP sent to your email to reset password</p>
            
            <form id="otpVerifyForm">
                <div class="form-group">
                    <label for="otpInput">Enter 6-digit OTP</label>
                    <input type="text" id="otpInput" name="otp" placeholder="000000" maxlength="6" inputmode="numeric" required>
                </div>

                <div id="otpError" class="text-danger small mb-3 d-none"></div>

                <button type="submit" class="btn-custom-green login-btn-spacing" style="width: 100%;">Verify OTP</button>
            </form>
            
            <div class="footer-link">
                <span><a href="login.html">Back to Login</a></span>
            </div>
        </div>
    </div>
<!-- Toast Notification Container -->
<div id="toastContainer" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>
    <script src="../js/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/verify-otp.js"></script>
    <script src="../js/notification.js"></script>
    
</body>
</html>
