<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCMS - Barangay San Gabriel</title>
    <link rel="icon" type="image/png" href="/assets/brgy-logo.PNG">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/landing.css">
</head>
<body class="bg-blurry-photo">
    <div class="landing-wrapper">
        <div class="landing-content">
            <div class="landing-header">
                <img src="../assets/brgy-logo.PNG" alt="Barangay Logo" class="landing-logo">
                <h1>Senior Citizen Monitoring System</h1>
                <p class="landing-subtitle">Barangay San Gabriel</p>
            </div>

            <div class="pin-section">
                <h3>Enter Admin PIN to Continue</h3>
                <p class="pin-hint">Only authorized administrators can access the system</p>
                
                <form id="pinForm" class="pin-form">
                    <div class="pin-input-group">
                        <input 
                            type="password" 
                            id="adminPin" 
                            class="pin-input" 
                            placeholder="••••••"
                            maxlength="6"
                            inputmode="numeric"
                            required>
                        <button type="button" id="togglePinVisibility" class="pin-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    
                    <div id="pinError" class="pin-error d-none"></div>
                    
                    <button type="submit" class="btn btn-custom-green btn-pin w-100">
                        Access System
                    </button>
                </form>

                <p class="pin-footer">
                    <small class="text-muted">This system is for authorized personnel only</small>
                </p>
            </div>

            <div class="landing-footer">
                <p>&copy; 2026 Barangay San Gabriel. All rights reserved.</p>
            </div>
        </div>
    </div>

    <div id="toastContainer" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

    <script src="../js/api.js"></script>
    <script src="../js/notification.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/landing.js"></script>
</body>
</html>
