<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input a Report - SCMS</title>
    <link rel="icon" type="image/png" href="/assets/brgy-logo.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/input-report.css"> </head>
<body>

    <div class="app-wrapper">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="sidebar collapsed" id="sidebar">
            <div class="sidebar-brand">
                <img src="../assets/brgy-logo.png" alt="Barangay Logo" class="brand-logo">
                <span>SCMS</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard Overview</a>
                <a href="user-profile.html" class="nav-item"><i class="far fa-address-card"></i> User Profile</a>
                <a href="input-report.html" class="nav-item active"><i class="fas fa-edit"></i> Input a report</a>
                <a href="view-reports.html" class="nav-item"><i class="far fa-folder-open"></i> View Reports</a>
                <a href="admin.html" class="nav-item"><i class="fas fa-user-plus"></i> Admin</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="btn btn-logout w-100">Log Out</a>
            </div>
        </aside>

        <div class="main-content" id="mainContent">
            <header class="top-header d-flex align-items-center gap-3">
                <button id="sidebarToggleBtn" class="btn text-white p-0 border-0 fs-5">
                    <i class="fas fa-bars"></i>
                </button>
                <span class="header-title">SCMS - Barangay San Gabriel | Senior Citizen Database</span>
            </header>
            
            <main class="page-content d-flex justify-content-center align-items-start pt-5 bg-logo-pattern"> 
                
                <div class="report-container w-100 px-4">
                    <form id="reportForm">
                        <div class="row gx-5">
                            
                            <div class="col-md-6">
                                                            
                                <div class="form-row-custom mb-3">
                                    <label for="reportName" class="form-label-custom">Name:</label>
                                    <div class="position-relative flex-grow-1">
                                        <input type="text" id="reportName" class="form-control custom-input-box pe-5" placeholder="Search a name" required autocomplete="off">
                                        <i class="fas fa-search position-absolute text-muted search-icon-custom"></i>
                                        
                                        <ul id="nameSearchResults" class="search-results-dropdown d-none"></ul>
                                    </div>
                                </div>

                                <div class="form-row-custom mb-3">
                                    <label for="reportBenefit" class="form-label-custom">Benefit/s:</label>
                                    <input type="text" id="reportBenefit" class="form-control custom-input-box flex-grow-1" placeholder="Input what benefit" required>
                                </div>

                                <div class="form-row-custom mb-3">
                                    <label for="reportDescription" class="form-label-custom">Description:</label>
                                    <input type="text" id="reportDescription" class="form-control custom-input-box flex-grow-1" placeholder='e.g. "P1000 Cash Aid"' required>
                                </div>

                                <div class="form-row-custom mb-3">
                                    <label for="reportDate" class="form-label-custom">Date Received:</label>
                                    <input type="date" id="reportDate" class="form-control custom-input-box flex-grow-1 text-muted" required>
                                </div>

                                <div class="form-row-custom mb-3">
                                    <label for="reportGivenBy" class="form-label-custom">Given By:</label>
                                    <input type="text" id="reportGivenBy" class="form-control custom-input-box flex-grow-1" placeholder="Name of the Staff" required>
                                </div>

                                <div class="form-row-custom mb-3">
                                    <label for="reportRemarks" class="form-label-custom">Remarks(Optional):</label>
                                    <input type="text" id="reportRemarks" class="form-control custom-input-box flex-grow-1">
                                </div>

                            </div>

                            <div class="col-md-6 d-flex flex-column align-items-center mt-4 mt-md-0">
                                                            
                                <div class="upload-box d-flex flex-column justify-content-center align-items-center w-100" id="uploadBox">
                                    <span class="mb-3 text-muted" id="uploadText">Drag a photo into this box or browse the file</span>
                                    
                                    <input type="file" id="reportPhoto" class="d-none" accept="image/*">
                                    
                                    <button type="button" class="btn btn-secondary px-4 py-1 rounded-1" id="btnBrowse">Browse</button>
                                </div>

                            </div>
                        </div>
                        
                        <div class="text-center mt-5 w-100">
                            <button type="submit" class="btn btn-custom-green btn-save-custom px-5 py-2 fs-5">Save</button>
                        </div>
                    </form>
                </div>

            </main>
        </div>
    </div>

    <div id="toastContainer" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

    <script src="../js/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/input-report.js"></script>
    <script src="../js/notification.js"></script>
</body>
</html>
